name: Print Software Versions

on:
  # запуск при push у гілку main
  push:
    branches: [main]
  # ручний запуск з вкладки Actions
  workflow_dispatch:

jobs:
  # BL-рівень (Сервер 1): ОС Linux, JVM 21, Spring Boot (*.jar)
  PrintSoftwareVersions:
    runs-on: ubuntu-latest
    steps:
      - name: Print Linux Version
        run: |
          uname -a
          lsb_release -a

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Print Java Version
        run: java --version

      - name: Print Maven Version
        run: mvn --version

      - name: Print Gradle Version
        run: gradle --version

  # AL-рівень (Сервер 2): ОС Linux, СКБД PostgreSQL
  PrintDBMSVersions:
    runs-on: ubuntu-latest
    needs: [PrintSoftwareVersions]
    steps:
      - name: Print PostgreSQL Client Version
        run: psql --version

      - name: Start PostgreSQL Server
        run: sudo systemctl start postgresql.service

      - name: Print PostgreSQL Server Version
        run: sudo -u postgres psql -c "SELECT version();"
